<h2>AI 搜尋如何產生答案</h2>
<p>引擎先找到候選來源，再由模型整理內容並產生回答。回答中的引文標示哪些來源與哪些句子相連。</p>

<h2>Google 的 AI 搜尋功能</h2>
<p>AI Overviews 提供概要與延伸連結。AI Mode 支援深入探索和比較。兩者都可能把問題拆成多個相關查詢，再整合結果。</p>

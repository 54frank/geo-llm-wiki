<h2>先補足可查證的資訊</h2>
<p>在 GEO 的受控實驗中，加入可信引文或相關統計能改善部分曝光指標。策略效果因查詢領域而異，應保留來源和適用條件。</p>
<p><a href="../sources/source-01.html">來源 01 的文獻摘要</a> · PDF 第 6–9 頁，§4、§5.1、§8，表 1、3</p>
<h2>一起檢查能見度與答案品質</h2>
<p>AutoGEO 從同一查詢的候選文件找出改寫規則。研究同時評估能見度和答案效用。部分場景的能見度上升，清晰度等指標仍可能下滑。</p>
<p><a href="../sources/source-02.html">來源 02 的文獻摘要</a> · PDF 第 3–8 頁，§3、§5.2，表 2</p>
